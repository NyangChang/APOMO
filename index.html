<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ADHDポモドーロ</title>
  <meta name="description" content="ADHDの先延ばしを防止するポモドーロタイマー">
  <meta name="theme-color" content="#FF7A00">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ADHDポモドーロ">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100dvh;
      padding: 24px 16px 32px;
      color: #222;
    }

    .app-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .app-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #222;
    }

    .app-subtitle {
      font-size: 12px;
      color: #999;
      margin-top: 2px;
      letter-spacing: 0.08em;
    }

    /* Timer circle */
    .timer-wrapper {
      position: relative;
      width: 260px;
      height: 260px;
      margin-bottom: 28px;
    }

    .timer-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .timer-bg-circle {
      fill: none;
      stroke: #f0f0f0;
      stroke-width: 8;
    }

    .timer-progress-circle {
      fill: none;
      stroke-width: 8;
      stroke-linecap: round;
      transition: stroke 0.4s ease;
    }

    .timer-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .timer-display {
      font-size: 52px;
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      color: #222;
    }

    .timer-status {
      font-size: 13px;
      font-weight: 600;
      padding: 4px 14px;
      border-radius: 20px;
      letter-spacing: 0.04em;
      transition: background 0.4s, color 0.4s;
    }

    .status-standby   { background: #FFF0E0; color: #FF7A00; }
    .status-idling    { background: #FFF0E0; color: #FF7A00; }
    .status-choice    { background: #FFF0E0; color: #FF7A00; }
    .status-working   { background: #FFF0E0; color: #FF7A00; }
    .status-break     { background: #E8F4FD; color: #4EA8DE; }

    /* Buttons row */
    .controls {
      display: flex;
      align-items: center;
      gap: 28px;
      margin-bottom: 20px;
    }

    .btn-main {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: none;
      background: #FF7A00;
      color: #fff;
      font-size: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(255, 122, 0, 0.4);
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .btn-main:active {
      transform: scale(0.92);
      box-shadow: 0 2px 8px rgba(255, 122, 0, 0.3);
    }

    .btn-main.break-mode {
      background: #4EA8DE;
      box-shadow: 0 4px 16px rgba(78, 168, 222, 0.4);
    }

    .btn-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: #888;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: color 0.15s, transform 0.1s;
    }

    .btn-icon:hover { color: #444; }
    .btn-icon:active { transform: scale(0.9); }
    .btn-icon:disabled { opacity: 0.3; cursor: default; }

    /* Description area */
    .description-area {
      width: 100%;
      max-width: 320px;
      min-height: 72px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      margin-bottom: 16px;
      position: relative;
    }

    .description-text {
      font-size: 13px;
      color: #555;
      line-height: 1.7;
    }

    .icon-decoration {
      position: absolute;
      bottom: 0;
      right: 4px;
      font-size: 28px;
      opacity: 0.65;
    }

    /* Choice buttons */
    .choice-panel {
      width: 100%;
      max-width: 320px;
      display: none;
      gap: 10px;
      margin-top: 4px;
    }

    .choice-panel.visible {
      display: flex;
    }

    .btn-choice {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 14px 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      transition: transform 0.1s, opacity 0.15s;
    }

    .btn-choice:active { transform: scale(0.97); }

    .btn-choice.continue {
      background: #FF7A00;
      color: #fff;
    }

    .btn-choice.rest {
      background: #FFF0E0;
      color: #FF7A00;
      border: 1.5px solid #FFD0A0;
    }

    .choice-icon {
      font-size: 18px;
    }

    .choice-label {
      font-size: 15px;
      font-weight: 700;
    }

    .choice-desc {
      font-size: 11px;
      opacity: 0.85;
      line-height: 1.4;
    }

    /* Pulsing ring for standby */
    @keyframes pulse-ring {
      0%   { opacity: 0.5; r: 112; }
      50%  { opacity: 0.15; r: 118; }
      100% { opacity: 0.5; r: 112; }
    }

    .pulse-circle {
      fill: none;
      stroke: #FF7A00;
      stroke-width: 3;
      opacity: 0;
      animation: none;
    }

    .pulse-circle.active {
      opacity: 0.4;
      animation: pulse-ring 2.2s ease-in-out infinite;
    }

    /* Session stats */
    .session-stats {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: #bbb;
    }

    .session-stats span {
      color: #FF7A00;
      font-weight: 600;
    }

    /* ── Tab bar ──────────────────────────────────────────────── */
    .tab-bar {
      width: 100%;
      max-width: 320px;
      display: flex;
      border-bottom: 2px solid #f0f0f0;
      margin-top: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 0;
      background: none;
      border: none;
      font-size: 13px;
      font-weight: 600;
      color: #bbb;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      letter-spacing: 0.04em;
      transition: color 0.2s, border-color 0.2s;
    }

    .tab-btn.active {
      color: #FF7A00;
      border-bottom-color: #FF7A00;
    }

    .tab-panel {
      display: none;
      width: 100%;
      max-width: 320px;
    }

    .tab-panel.active {
      display: block;
    }

    /* ── News ─────────────────────────────────────────────────── */
    .news-header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 6px;
      padding: 8px 0 4px;
      font-size: 11px;
      color: #ccc;
    }

    .news-header button {
      background: none;
      border: none;
      color: #FF7A00;
      font-size: 16px;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
    }

    .news-item {
      display: block;
      padding: 11px 0;
      border-bottom: 1px solid #f5f5f5;
      text-decoration: none;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .news-item:active { opacity: 0.55; }

    .news-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 5px;
    }

    .news-source {
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      background: #FF7A00;
      padding: 2px 8px;
      border-radius: 10px;
      white-space: nowrap;
    }

    .news-source.court  { background: #4EA8DE; }
    .news-source.bengo  { background: #6C5CE7; }

    .news-time {
      font-size: 11px;
      color: #bbb;
    }

    .news-title {
      font-size: 13px;
      line-height: 1.55;
      color: #222;
    }

    .news-loading {
      text-align: center;
      font-size: 13px;
      color: #bbb;
      padding: 28px 0;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="app-title">ADHDポモドーロ</div>
    <div class="app-subtitle">for ADHD</div>
  </header>

  <div class="timer-wrapper">
    <svg class="timer-svg" viewBox="0 0 260 260">
      <circle class="timer-bg-circle" cx="130" cy="130" r="112"/>
      <circle class="pulse-circle" id="pulseCircle" cx="130" cy="130" r="112"/>
      <circle class="timer-progress-circle" id="progressCircle"
        cx="130" cy="130" r="112"
        stroke="#FF7A00"
        stroke-dasharray="703.7"
        stroke-dashoffset="703.7"/>
    </svg>
    <div class="timer-center">
      <div class="timer-display" id="timerDisplay">00:00</div>
      <div class="timer-status status-standby" id="timerStatus">待機中...</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn-icon" id="btnReset" title="リセット" disabled>↺</button>
    <button class="btn-icon" id="btnSkip" title="スキップ" disabled>›</button>
    <button class="btn-main" id="btnMain" title="スタート">▶</button>
  </div>

  <div class="description-area">
    <p class="description-text" id="descText">
      あわわポモドーロはADHDの「先延ばし」を防止するADHD向け作業タイマーです！<br>
      まずは上の再生ボタンを押して1分間だけのアイドリング作業を実施しましょう！<br>
      1分だけ作業した後は休憩もできるのでまずは1分！
    </p>
    <div class="icon-decoration" id="iconDeco">🧑‍💻</div>
  </div>

  <div class="choice-panel" id="choicePanel">
    <button class="btn-choice continue" id="btnContinue">
      <span class="choice-icon">🧑‍💻</span>
      <span class="choice-label">続行</span>
      <span class="choice-desc">このまま作業を継続します</span>
    </button>
    <button class="btn-choice rest" id="btnRest">
      <span class="choice-icon">☕</span>
      <span class="choice-label">休憩</span>
      <span class="choice-desc">好きなだけ休憩してから再度アイドリング作業を実施します</span>
    </button>
  </div>

  <nav class="tab-bar">
    <button class="tab-btn active" id="tabTimer" data-tab="timer">⏱ タイマー</button>
    <button class="tab-btn" id="tabNews" data-tab="news">📰 ニュース</button>
  </nav>

  <div class="tab-panel active" data-panel="timer">
    <div class="session-stats" id="sessionStats" style="display:none">
      本日の作業時間: <span id="totalWorkDisplay">0分</span>
    </div>
  </div>

  <div class="tab-panel" data-panel="news">
    <div class="news-header">
      <span id="newsLastUpdate"></span>
      <button id="btnNewsRefresh" title="更新">↺</button>
    </div>
    <div id="newsList">
      <div class="news-loading">ニュースタブを開くと読み込みます</div>
    </div>
  </div>

  <script>
    // ── Constants ──────────────────────────────────────────────
    const IDLING_SEC    = 60;   // 1 minute idling
    const CIRCUMFERENCE = 2 * Math.PI * 112; // ≈ 703.7

    // ── State ──────────────────────────────────────────────────
    let phase = 'standby'; // standby | idling | choice | working | break
    let elapsed = 0;       // seconds in current phase
    let workTotal = 0;     // cumulative work seconds (idling + working)
    let isPaused = false;
    let tickInterval = null;
    let phaseStartTime = null;  // performance.now() when phase started
    let pausedAccum = 0;        // total paused ms in current phase
    let pauseStartTime = null;  // performance.now() when paused

    // ── DOM refs ───────────────────────────────────────────────
    const timerDisplay  = document.getElementById('timerDisplay');
    const timerStatus   = document.getElementById('timerStatus');
    const progressCircle= document.getElementById('progressCircle');
    const pulseCircle   = document.getElementById('pulseCircle');
    const btnMain       = document.getElementById('btnMain');
    const btnReset      = document.getElementById('btnReset');
    const btnSkip       = document.getElementById('btnSkip');
    const descText      = document.getElementById('descText');
    const iconDeco      = document.getElementById('iconDeco');
    const choicePanel   = document.getElementById('choicePanel');
    const btnContinue   = document.getElementById('btnContinue');
    const btnRest       = document.getElementById('btnRest');
    const sessionStats  = document.getElementById('sessionStats');
    const totalWorkDisplay = document.getElementById('totalWorkDisplay');

    // ── Helpers ────────────────────────────────────────────────
    function pad(n) { return String(n).padStart(2, '0'); }

    function formatTime(secs) {
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      return `${pad(m)}:${pad(s)}`;
    }

    function setProgress(ratio, color) {
      const offset = CIRCUMFERENCE * (1 - Math.max(0, Math.min(1, ratio)));
      progressCircle.style.strokeDashoffset = offset;
      progressCircle.style.stroke = color;
    }

    function clearTick() {
      if (tickInterval) { clearInterval(tickInterval); tickInterval = null; }
    }

    function getSmoothedElapsed() {
      if (phaseStartTime === null) return elapsed;
      const now = performance.now();
      const paused = pausedAccum + (isPaused && pauseStartTime !== null ? now - pauseStartTime : 0);
      return (now - phaseStartTime - paused) / 1000;
    }

    function markPhaseStart() {
      phaseStartTime = performance.now();
      pausedAccum = 0;
      pauseStartTime = null;
    }

    // ── Render ─────────────────────────────────────────────────
    function render() {
      choicePanel.classList.remove('visible');

      // Pulse ring for standby
      pulseCircle.classList.toggle('active', phase === 'standby');

      switch (phase) {

        case 'standby':
          timerDisplay.textContent = '00:00';
          setProgress(0, '#FF7A00');
          setStatus('待機中...', 'status-standby');
          btnMain.innerHTML = '▶';
          btnMain.classList.remove('break-mode');
          btnReset.disabled = true;
          btnSkip.disabled  = true;
          descText.innerHTML = 'ADHDポモドーロはADHDの「先延ばし」を防止するADHD向け作業タイマーです！<br>まずは上の再生ボタンを押して1分間だけのアイドリング作業を実施しましょう！<br>1分だけ作業した後は休憩もできるのでまずは1分！';
          iconDeco.textContent = '🧑‍💻';
          break;

        case 'idling':
          timerDisplay.textContent = formatTime(workTotal);
          setProgress(elapsed / IDLING_SEC, '#FF7A00');
          setStatus('アイドリング中...', 'status-idling');
          btnMain.innerHTML = isPaused ? '▶' : '⏸';
          btnMain.classList.remove('break-mode');
          btnReset.disabled = false;
          btnSkip.disabled  = true;
          descText.innerHTML = 'アイドリング作業中！まず1分だけ頑張りましょう。<br>1分たったら続行か休憩かを選べます。';
          iconDeco.textContent = '🧑‍💻';
          break;

        case 'choice':
          timerDisplay.textContent = formatTime(workTotal);
          setProgress(1, '#FF7A00');
          setStatus('アイドリング中...', 'status-choice');
          btnMain.innerHTML = '▶';
          btnMain.classList.remove('break-mode');
          btnReset.disabled = false;
          btnSkip.disabled  = true;
          descText.innerHTML = 'アイドリング作業が終了しました。<br>このまま作業を継続するか一度休憩するかを選んでください。';
          iconDeco.textContent = '';
          choicePanel.classList.add('visible');
          break;

        case 'working':
          timerDisplay.textContent = formatTime(workTotal);
          setProgress(1, '#FF7A00');
          setStatus('作業中', 'status-working');
          btnMain.innerHTML = isPaused ? '▶' : '⏸';
          btnMain.classList.remove('break-mode');
          btnReset.disabled = false;
          btnSkip.disabled  = false;
          descText.innerHTML = 'ナイス継続です！この調子で気の向くまで存分に作業を実施しましょう。<br>中央のスキップボタンを押すと休憩に入ることができます。';
          iconDeco.textContent = '🧑‍💻';
          break;

        case 'break':
          timerDisplay.textContent = formatTime(elapsed);
          setProgress(1, '#4EA8DE');
          setStatus('休憩中', 'status-break');
          btnMain.innerHTML = isPaused ? '▶' : '⏸';
          btnMain.classList.add('break-mode');
          btnReset.disabled = false;
          btnSkip.disabled  = false;
          descText.innerHTML = 'ゆっくり休憩しましょう。時間制限はありません。<br>準備できたらスキップで次のアイドリング作業へ。';
          iconDeco.textContent = '☕';
          break;
      }

      // Session stats
      if (workTotal > 0) {
        sessionStats.style.display = 'block';
        const mins = Math.floor(workTotal / 60);
        const secs = workTotal % 60;
        totalWorkDisplay.textContent = mins > 0 ? `${mins}分${secs}秒` : `${secs}秒`;
      }
    }

    function setStatus(text, cls) {
      timerStatus.textContent = text;
      timerStatus.className = 'timer-status ' + cls;
    }

    // ── Sound effects ───────────────────────────────────────────
    function playCoinSound() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const ctx = new AudioCtx();
      const gain = ctx.createGain();
      gain.connect(ctx.destination);

      // Mario coin: B5 (988Hz) → E6 (1319Hz), square wave, quick decay
      [[988, 0, 0.08], [1319, 0.08, 0.28]].forEach(([freq, start, end]) => {
        const osc = ctx.createOscillator();
        osc.type = 'square';
        osc.frequency.value = freq;
        osc.connect(gain);
        osc.start(ctx.currentTime + start);
        osc.stop(ctx.currentTime + end);
      });

      gain.gain.setValueAtTime(0.18, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
    }
    function startIdling() {
      clearTick();
      phase = 'idling';
      elapsed = 0;
      isPaused = false;
      markPhaseStart();
      tickInterval = setInterval(tick, 1000);
      render();
    }

    function startWorking() {
      clearTick();
      phase = 'working';
      elapsed = 0;
      isPaused = false;
      markPhaseStart();
      tickInterval = setInterval(tick, 1000);
      render();
    }

    function startBreak() {
      clearTick();
      phase = 'break';
      elapsed = 0;
      isPaused = false;
      markPhaseStart();
      tickInterval = setInterval(tick, 1000);
      render();
    }

    function showChoice() {
      clearTick();
      phase = 'choice';
      isPaused = false;
      playCoinSound();
      render();
    }

    function reset() {
      clearTick();
      phase = 'standby';
      elapsed = 0;
      workTotal = 0;
      isPaused = false;
      phaseStartTime = null;
      pausedAccum = 0;
      pauseStartTime = null;
      render();
      sessionStats.style.display = 'none';
    }

    // ── Tick ───────────────────────────────────────────────────
    function tick() {
      if (isPaused) return;
      elapsed++;

      if (phase === 'idling') {
        workTotal++;
        if (elapsed >= IDLING_SEC) {
          showChoice();
          return;
        }
      } else if (phase === 'working') {
        workTotal++;
      } else if (phase === 'break') {
        // 無制限休憩 - スキップボタンで終了
      }

      render();
    }

    // ── Button handlers ────────────────────────────────────────
    btnMain.addEventListener('click', () => {
      if (phase === 'standby') {
        startIdling();
        return;
      }
      if (phase === 'choice') {
        // Play from choice = same as 続行
        startWorking();
        return;
      }
      // Toggle pause
      isPaused = !isPaused;
      if (isPaused) {
        pauseStartTime = performance.now();
      } else {
        if (pauseStartTime !== null) {
          pausedAccum += performance.now() - pauseStartTime;
          pauseStartTime = null;
        }
        clearTick();
        tickInterval = setInterval(tick, 1000);
      }
      render();
    });

    btnSkip.addEventListener('click', () => {
      if (phase === 'working') {
        startBreak();
      } else if (phase === 'break') {
        startIdling();
      }
    });

    btnReset.addEventListener('click', () => {
      reset();
    });

    btnContinue.addEventListener('click', () => {
      startWorking();
    });

    btnRest.addEventListener('click', () => {
      startBreak();
    });

    // ── News ────────────────────────────────────────────────────
    const FEEDS = [
      { url: 'https://www.nhk.or.jp/rss/news/cat1.xml',  name: 'NHK',        cls: 'nhk'   },
      { url: 'https://www.courts.go.jp/rss/index.xml',   name: '裁判所',      cls: 'court' },
      { url: 'https://www.bengo4.com/rss/',              name: '弁護士ドットコム', cls: 'bengo' },
    ];
    const RSS_PROXY = 'https://api.rss2json.com/v1/api.json?rss_url=';
    const NEWS_INTERVAL = 300 * 1000; // 5 minutes
    let newsLoaded = false;
    let newsRefreshTimer = null;

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function relativeTime(dateStr) {
      const diff = (Date.now() - new Date(dateStr).getTime()) / 1000;
      if (diff < 60)    return 'たった今';
      if (diff < 3600)  return `${Math.floor(diff / 60)}分前`;
      if (diff < 86400) return `${Math.floor(diff / 3600)}時間前`;
      return `${Math.floor(diff / 86400)}日前`;
    }

    async function fetchFeed(feed) {
      const res = await fetch(RSS_PROXY + encodeURIComponent(feed.url));
      const data = await res.json();
      if (data.status !== 'ok') return [];
      return data.items.map(item => ({
        title: item.title,
        link:  item.link,
        pubDate: item.pubDate,
        source: feed.name,
        cls:    feed.cls,
      }));
    }

    async function fetchNews() {
      const list = document.getElementById('newsList');
      list.innerHTML = '<div class="news-loading">読み込み中...</div>';
      clearTimeout(newsRefreshTimer);

      try {
        const results = await Promise.allSettled(FEEDS.map(fetchFeed));
        const items = results
          .flatMap(r => r.status === 'fulfilled' ? r.value : [])
          .sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate))
          .slice(0, 40);

        if (items.length === 0) {
          list.innerHTML = '<div class="news-loading">記事を取得できませんでした</div>';
        } else {
          list.innerHTML = items.map(item => `
            <a class="news-item" href="${escapeHtml(item.link)}" target="_blank" rel="noopener noreferrer">
              <div class="news-meta">
                <span class="news-source ${item.cls}">${escapeHtml(item.source)}</span>
                <span class="news-time">${relativeTime(item.pubDate)}</span>
              </div>
              <div class="news-title">${escapeHtml(item.title)}</div>
            </a>`).join('');
          newsLoaded = true;
        }

        const now = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
        document.getElementById('newsLastUpdate').textContent = `更新 ${now}`;
      } catch {
        list.innerHTML = '<div class="news-loading">取得エラー — ↺ で再試行</div>';
      }

      newsRefreshTimer = setTimeout(fetchNews, NEWS_INTERVAL);
    }

    // ── Tab switching ───────────────────────────────────────────
    function switchTab(name) {
      document.querySelectorAll('.tab-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.tab === name));
      document.querySelectorAll('.tab-panel').forEach(p =>
        p.classList.toggle('active', p.dataset.panel === name));
      if (name === 'news' && !newsLoaded) fetchNews();
    }

    document.getElementById('tabTimer').addEventListener('click', () => switchTab('timer'));
    document.getElementById('tabNews').addEventListener('click',  () => switchTab('news'));
    document.getElementById('btnNewsRefresh').addEventListener('click', fetchNews);

    // ── Animation loop (smooth circle) ─────────────────────────
    function animationLoop() {
      if (phase === 'idling' && phaseStartTime !== null) {
        const smooth = getSmoothedElapsed();
        const offset = CIRCUMFERENCE * (1 - Math.min(1, smooth / IDLING_SEC));
        progressCircle.style.strokeDashoffset = offset;
      }
      requestAnimationFrame(animationLoop);
    }
    requestAnimationFrame(animationLoop);

    // ── Init ───────────────────────────────────────────────────
    render();

    // ── Service Worker ─────────────────────────────────────────
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
