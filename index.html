<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ADHDポモドーロ</title>
  <meta name="description" content="ADHDの先延ばしを防止するポモドーロタイマー">
  <meta name="theme-color" content="#FF7A00">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ADHDポモドーロ">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100dvh;
      padding: 24px 16px 32px;
      color: #222;
    }

    .app-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .app-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #222;
    }

    .app-subtitle {
      font-size: 12px;
      color: #999;
      margin-top: 2px;
      letter-spacing: 0.08em;
    }

    /* Timer circle */
    .timer-wrapper {
      position: relative;
      width: 260px;
      height: 260px;
      margin-bottom: 28px;
    }

    .timer-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .timer-bg-circle {
      fill: none;
      stroke: #f0f0f0;
      stroke-width: 8;
    }

    .timer-progress-circle {
      fill: none;
      stroke-width: 8;
      stroke-linecap: round;
      transition: stroke 0.4s ease;
    }

    .timer-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .timer-display {
      font-size: 52px;
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      color: #222;
    }

    .timer-status {
      font-size: 13px;
      font-weight: 600;
      padding: 4px 14px;
      border-radius: 20px;
      letter-spacing: 0.04em;
      transition: background 0.4s, color 0.4s;
    }

    .status-standby   { background: #FFF0E0; color: #FF7A00; }
    .status-idling    { background: #FFF0E0; color: #FF7A00; }
    .status-choice    { background: #FFF0E0; color: #FF7A00; }
    .status-working   { background: #FFF0E0; color: #FF7A00; }
    .status-break     { background: #E8F4FD; color: #4EA8DE; }

    /* Buttons row */
    .controls {
      display: flex;
      align-items: center;
      gap: 28px;
      margin-bottom: 20px;
    }

    .btn-main {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: none;
      background: #FF7A00;
      color: #fff;
      font-size: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(255, 122, 0, 0.4);
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .btn-main:active {
      transform: scale(0.92);
      box-shadow: 0 2px 8px rgba(255, 122, 0, 0.3);
    }

    .btn-main.break-mode {
      background: #4EA8DE;
      box-shadow: 0 4px 16px rgba(78, 168, 222, 0.4);
    }

    .btn-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: #888;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: color 0.15s, transform 0.1s;
    }

    .btn-icon:hover { color: #444; }
    .btn-icon:active { transform: scale(0.9); }
    .btn-icon:disabled { opacity: 0.3; cursor: default; }

    /* Description area */
    .description-area {
      width: 100%;
      max-width: 320px;
      min-height: 72px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      margin-bottom: 16px;
      position: relative;
    }

    .description-text {
      font-size: 13px;
      color: #555;
      line-height: 1.7;
    }

    .icon-decoration {
      position: absolute;
      bottom: 0;
      right: 4px;
      font-size: 28px;
      opacity: 0.65;
    }

    /* Choice buttons */
    .choice-panel {
      width: 100%;
      max-width: 320px;
      display: none;
      gap: 10px;
      margin-top: 4px;
    }

    .choice-panel.visible {
      display: flex;
    }

    .btn-choice {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 14px 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      transition: transform 0.1s, opacity 0.15s;
    }

    .btn-choice:active { transform: scale(0.97); }

    .btn-choice.continue {
      background: #FF7A00;
      color: #fff;
    }

    .btn-choice.rest {
      background: #FFF0E0;
      color: #FF7A00;
      border: 1.5px solid #FFD0A0;
    }

    .choice-icon {
      font-size: 18px;
    }

    .choice-label {
      font-size: 15px;
      font-weight: 700;
    }

    .choice-desc {
      font-size: 11px;
      opacity: 0.85;
      line-height: 1.4;
    }

    /* Pulsing ring for standby */
    @keyframes pulse-ring {
      0%   { opacity: 0.5; r: 112; }
      50%  { opacity: 0.15; r: 118; }
      100% { opacity: 0.5; r: 112; }
    }

    .pulse-circle {
      fill: none;
      stroke: #FF7A00;
      stroke-width: 3;
      opacity: 0;
      animation: none;
    }

    .pulse-circle.active {
      opacity: 0.4;
      animation: pulse-ring 2.2s ease-in-out infinite;
    }

    /* Session stats */
    .session-stats {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: #bbb;
    }

    .session-stats span {
      color: #FF7A00;
      font-weight: 600;
    }

    /* ── History link ─────────────────────────────────────────── */
    .history-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 320px;
      padding: 11px 16px;
      text-decoration: none;
      color: #FF7A00;
      font-size: 13px;
      font-weight: 600;
      background: #FFF7F0;
      border-radius: 10px;
      border: 1px solid #FFE0C0;
      margin-top: 12px;
      transition: opacity 0.15s;
    }

    .history-link:active { opacity: 0.65; }

    .history-link-arrow {
      font-size: 16px;
      opacity: 0.6;
    }

    /* ── Tab bar ──────────────────────────────────────────────── */
    .tab-bar {
      width: 100%;
      max-width: 320px;
      display: flex;
      border-bottom: 2px solid #f0f0f0;
      margin-top: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 0;
      background: none;
      border: none;
      font-size: 13px;
      font-weight: 600;
      color: #bbb;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      letter-spacing: 0.04em;
      transition: color 0.2s, border-color 0.2s;
    }

    .tab-btn.active {
      color: #FF7A00;
      border-bottom-color: #FF7A00;
    }

    .tab-panel {
      display: none;
      width: 100%;
      max-width: 320px;
    }

    .tab-panel.active {
      display: block;
    }

    /* ── News ─────────────────────────────────────────────────── */
    .news-header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 6px;
      padding: 8px 0 4px;
      font-size: 11px;
      color: #ccc;
    }

    .news-header button {
      background: none;
      border: none;
      color: #FF7A00;
      font-size: 16px;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
    }

    .news-item {
      display: block;
      padding: 11px 0;
      border-bottom: 1px solid #f5f5f5;
      text-decoration: none;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .news-item:active { opacity: 0.55; }

    .news-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 5px;
    }

    .news-source {
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      background: #FF7A00;
      padding: 2px 8px;
      border-radius: 10px;
      white-space: nowrap;
    }


.news-time {
      font-size: 11px;
      color: #bbb;
    }

    .news-title {
      font-size: 13px;
      line-height: 1.55;
      color: #222;
    }

    .news-loading {
      text-align: center;
      font-size: 13px;
      color: #bbb;
      padding: 28px 0;
    }

    /* ── Shindoi ────────────────────────────────────────────────── */
    .shindoi-section {
      width: 100%;
      max-width: 320px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 22px;
    }

    .btn-shindoi {
      flex-shrink: 0;
      padding: 9px 14px;
      border: 1.5px solid #FFCCCC;
      border-radius: 20px;
      background: #FFF0F0;
      color: #D04040;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s;
      letter-spacing: 0.02em;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-shindoi:active { transform: scale(0.90); background: #FFE0E0; }

    .shindoi-gauge-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding-top: 3px;
    }

    .shindoi-gauge-bg {
      height: 20px;
      background: #f0f0f0;
      border-radius: 12px;
      overflow: hidden;
    }

    .shindoi-gauge-fill {
      height: 100%;
      width: 0%;
      border-radius: 12px;
      background: #4EA8DE;
      transition: width 0.15s ease, background 0.3s ease;
    }

    .shindoi-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
    }

    .shindoi-count-text { color: #ccc; }

    .shindoi-explosion-badge {
      color: #FF3B30;
      font-weight: 700;
      font-size: 12px;
    }

    @keyframes gauge-shake {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      20%  { transform: translateX(-5px) rotate(-1.5deg); }
      40%  { transform: translateX(5px) rotate(1.5deg); }
      60%  { transform: translateX(-4px) rotate(-1deg); }
      80%  { transform: translateX(4px) rotate(1deg); }
    }

    .shindoi-gauge-wrap.shaking { animation: gauge-shake 0.35s ease-in-out infinite; }

    @keyframes gauge-explode {
      0%   { transform: scale(1, 1); }
      20%  { transform: scale(1.06, 1.5); }
      45%  { transform: scale(0.97, 1.1); }
      65%  { transform: scale(1.03, 1.25); }
      85%  { transform: scale(0.99, 1.0); }
      100% { transform: scale(1, 1); }
    }

    .shindoi-gauge-wrap.exploding { animation: gauge-explode 0.5s ease-out forwards; }

    @keyframes confetti-fall {
      0%   { transform: translateY(-10px) rotate(0deg) scale(1); opacity: 1; }
      80%  { opacity: 1; }
      100% { transform: translateY(105vh) rotate(720deg) scale(0.5); opacity: 0; }
    }

    .confetti-piece {
      position: fixed;
      top: -15px;
      border-radius: 3px;
      animation: confetti-fall linear forwards;
      z-index: 9999;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="app-title">ADHDポモドーロ</div>
  </header>

  <div class="shindoi-section">
    <button class="btn-shindoi" id="btnShindoi">😣 しんどい</button>
    <div class="shindoi-gauge-wrap" id="shindoiGaugeWrap">
      <div class="shindoi-gauge-bg">
        <div class="shindoi-gauge-fill" id="shindoiGaugeFill"></div>
      </div>
      <div class="shindoi-meta">
        <span class="shindoi-count-text" id="shindoiCountText"></span>
        <span class="shindoi-explosion-badge" id="shindoiExplosionBadge" style="display:none">💥 <span id="shindoiExplosionCount">0</span>回</span>
      </div>
    </div>
  </div>

  <div class="timer-wrapper">
    <svg class="timer-svg" viewBox="0 0 260 260">
      <circle class="timer-bg-circle" cx="130" cy="130" r="112"/>
      <circle class="pulse-circle" id="pulseCircle" cx="130" cy="130" r="112"/>
      <circle class="timer-progress-circle" id="progressCircle"
        cx="130" cy="130" r="112"
        stroke="#FF7A00"
        stroke-dasharray="703.7"
        stroke-dashoffset="703.7"/>
    </svg>
    <div class="timer-center">
      <div class="timer-display" id="timerDisplay">00:00</div>
      <div class="timer-status status-standby" id="timerStatus">待機中...</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn-icon" id="btnReset" title="リセット" disabled>↺</button>
    <button class="btn-icon" id="btnSkip" title="スキップ" disabled>›</button>
    <button class="btn-main" id="btnMain" title="スタート">▶</button>
  </div>

  <div class="description-area">
    <p class="description-text" id="descText">
      今日も一日頑張りましょう！<br>
    </p>
    <div class="icon-decoration" id="iconDeco">🧑‍💻</div>
  </div>

  <div class="choice-panel" id="choicePanel">
    <button class="btn-choice continue" id="btnContinue">
      <span class="choice-icon">🧑‍💻</span>
      <span class="choice-label">続行</span>
      <span class="choice-desc">このまま作業を継続します</span>
    </button>
    <button class="btn-choice rest" id="btnRest">
      <span class="choice-icon">☕</span>
      <span class="choice-label">休憩</span>
      <span class="choice-desc">好きなだけ休憩してから再度アイドリング作業を実施します</span>
    </button>
  </div>

  <a href="history.html" class="history-link">
    <span>📊 今までの記録</span>
    <span class="history-link-arrow">›</span>
  </a>

  <nav class="tab-bar">
    <button class="tab-btn active" id="tabTimer" data-tab="timer">⏱ タイマー</button>
    <button class="tab-btn" id="tabNews" data-tab="news">📰 ニュース</button>
  </nav>

  <div class="tab-panel active" data-panel="timer">
    <div class="session-stats" id="sessionStats" style="display:none">
      本日の作業時間: <span id="totalWorkDisplay">0分</span>
    </div>
  </div>

  <div class="tab-panel" data-panel="news">
    <div class="news-header">
      <span id="newsLastUpdate"></span>
      <button id="btnNewsRefresh" title="更新">↺</button>
    </div>
    <div id="newsList">
      <div class="news-loading">ニュースタブを開くと読み込みます</div>
    </div>
  </div>

  <script>
    // ── Constants ──────────────────────────────────────────────
    const IDLING_SEC    = 60;   // 1 minute idling
    const CIRCUMFERENCE = 2 * Math.PI * 112; // ≈ 703.7

    // ── State ──────────────────────────────────────────────────
    let phase = 'standby'; // standby | idling | choice | working | break
    let elapsed = 0;       // seconds in current phase
    let workTotal = 0;     // cumulative work seconds (idling + working)
    let isPaused = false;
    let tickInterval = null;
    let phaseStartTime = null;  // performance.now() when phase started
    let pausedAccum = 0;        // total paused ms in current phase
    let pauseStartTime = null;  // performance.now() when paused

    let shindoiCount   = 0;  // 今日のタップ数
    let explosionCount = 0;  // 今日の爆発回数
    const SHINDOI_MAX     = 800;
    const SHINDOI_SHAKE   = 800;  // 801タップ目からぷるぷる
    const SHINDOI_EXPLODE = 851;  // 851タップ目で爆発
    const SHINDOI_KEY     = 'adhd-shindoi';

    // ── DOM refs ───────────────────────────────────────────────
    const timerDisplay  = document.getElementById('timerDisplay');
    const timerStatus   = document.getElementById('timerStatus');
    const progressCircle= document.getElementById('progressCircle');
    const pulseCircle   = document.getElementById('pulseCircle');
    const btnMain       = document.getElementById('btnMain');
    const btnReset      = document.getElementById('btnReset');
    const btnSkip       = document.getElementById('btnSkip');
    const descText      = document.getElementById('descText');
    const iconDeco      = document.getElementById('iconDeco');
    const choicePanel   = document.getElementById('choicePanel');
    const btnContinue   = document.getElementById('btnContinue');
    const btnRest       = document.getElementById('btnRest');
    const sessionStats  = document.getElementById('sessionStats');
    const totalWorkDisplay = document.getElementById('totalWorkDisplay');

    const btnShindoi             = document.getElementById('btnShindoi');
    const shindoiGaugeWrap       = document.getElementById('shindoiGaugeWrap');
    const shindoiGaugeFill       = document.getElementById('shindoiGaugeFill');
    const shindoiCountText       = document.getElementById('shindoiCountText');
    const shindoiExplosionBadge  = document.getElementById('shindoiExplosionBadge');
    const shindoiExplosionCountEl = document.getElementById('shindoiExplosionCount');

    // ── Helpers ────────────────────────────────────────────────
    function pad(n) { return String(n).padStart(2, '0'); }

    function formatTime(secs) {
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      return `${pad(m)}:${pad(s)}`;
    }

    function setProgress(ratio, color) {
      const offset = CIRCUMFERENCE * (1 - Math.max(0, Math.min(1, ratio)));
      progressCircle.style.strokeDashoffset = offset;
      progressCircle.style.stroke = color;
    }

    function clearTick() {
      if (tickInterval) { clearInterval(tickInterval); tickInterval = null; }
    }

    function getSmoothedElapsed() {
      if (phaseStartTime === null) return elapsed;
      const now = performance.now();
      const paused = pausedAccum + (isPaused && pauseStartTime !== null ? now - pauseStartTime : 0);
      return (now - phaseStartTime - paused) / 1000;
    }

    function markPhaseStart() {
      phaseStartTime = performance.now();
      pausedAccum = 0;
      pauseStartTime = null;
    }

    // ── Render ─────────────────────────────────────────────────
    function render() {
      choicePanel.classList.remove('visible');

      // Pulse ring for standby
      pulseCircle.classList.toggle('active', phase === 'standby');

      switch (phase) {

        case 'standby':
          timerDisplay.textContent = '00:00';
          setProgress(0, '#FF7A00');
          setStatus('待機中...', 'status-standby');
          btnMain.innerHTML = '▶';
          btnMain.classList.remove('break-mode');
          btnReset.disabled = true;
          btnSkip.disabled  = true;
          descText.innerHTML = 'ADHDポモドーロはADHDの「先延ばし」を防止するADHD向け作業タイマーです！<br>まずは上の再生ボタンを押して1分間だけのアイドリング作業を実施しましょう！<br>1分だけ作業した後は休憩もできるのでまずは1分！';
          iconDeco.textContent = '🧑‍💻';
          break;

        case 'idling':
          timerDisplay.textContent = formatTime(workTotal);
          setProgress(elapsed / IDLING_SEC, '#FF7A00');
          setStatus('アイドリング中...', 'status-idling');
          btnMain.innerHTML = isPaused ? '▶' : '⏸';
          btnMain.classList.remove('break-mode');
          btnReset.disabled = false;
          btnSkip.disabled  = true;
          descText.innerHTML = 'アイドリング作業中！まず1分だけ頑張りましょう。<br>1分たったら続行か休憩かを選べます。';
          iconDeco.textContent = '🧑‍💻';
          break;

        case 'choice':
          timerDisplay.textContent = formatTime(workTotal);
          setProgress(1, '#FF7A00');
          setStatus('アイドリング中...', 'status-choice');
          btnMain.innerHTML = '▶';
          btnMain.classList.remove('break-mode');
          btnReset.disabled = false;
          btnSkip.disabled  = true;
          descText.innerHTML = 'アイドリング作業が終了しました。<br>このまま作業を継続するか一度休憩するかを選んでください。';
          iconDeco.textContent = '';
          choicePanel.classList.add('visible');
          break;

        case 'working':
          timerDisplay.textContent = formatTime(workTotal);
          setProgress(1, '#FF7A00');
          setStatus('作業中', 'status-working');
          btnMain.innerHTML = isPaused ? '▶' : '⏸';
          btnMain.classList.remove('break-mode');
          btnReset.disabled = false;
          btnSkip.disabled  = false;
          descText.innerHTML = 'ナイス継続です！この調子で気の向くまで存分に作業を実施しましょう。<br>中央のスキップボタンを押すと休憩に入ることができます。';
          iconDeco.textContent = '🧑‍💻';
          break;

        case 'break':
          timerDisplay.textContent = formatTime(elapsed);
          setProgress(1, '#4EA8DE');
          setStatus('休憩中', 'status-break');
          btnMain.innerHTML = isPaused ? '▶' : '⏸';
          btnMain.classList.add('break-mode');
          btnReset.disabled = false;
          btnSkip.disabled  = false;
          descText.innerHTML = 'ゆっくり休憩しましょう。時間制限はありません。<br>準備できたらスキップで次のアイドリング作業へ。';
          iconDeco.textContent = '☕';
          break;
      }

      // Session stats
      if (workTotal > 0) {
        sessionStats.style.display = 'block';
        const mins = Math.floor(workTotal / 60);
        const secs = workTotal % 60;
        totalWorkDisplay.textContent = mins > 0 ? `${mins}分${secs}秒` : `${secs}秒`;
      }
    }

    function setStatus(text, cls) {
      timerStatus.textContent = text;
      timerStatus.className = 'timer-status ' + cls;
    }

    // ── Persistence ─────────────────────────────────────────────
    const STATE_KEY   = 'adhd-timer-state';
    const HISTORY_KEY = 'adhd-history';

    function todayStr() { return new Date().toLocaleDateString('sv'); } // YYYY-MM-DD

    function saveHistory() {
      const hist = JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}');
      hist[todayStr()] = workTotal;
      localStorage.setItem(HISTORY_KEY, JSON.stringify(hist));
    }

    function saveState() {
      localStorage.setItem(STATE_KEY, JSON.stringify({
        phase, elapsed, workTotal, isPaused,
        savedAt: Date.now(),
        savedDate: todayStr(),
      }));
    }

    function loadState() {
      const today = todayStr();
      const hist  = JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}');

      let s;
      try { s = JSON.parse(localStorage.getItem(STATE_KEY) || 'null'); } catch { s = null; }

      // 別の日のデータなら workTotal だけ今日分を復元してスタンバイ
      if (!s || s.savedDate !== today) {
        workTotal = hist[today] || 0;
        return;
      }

      workTotal = s.workTotal;
      isPaused  = s.isPaused;
      phase     = s.phase;

      const passedSec = Math.floor((Date.now() - s.savedAt) / 1000);

      if (s.phase === 'idling' && !s.isPaused) {
        const newElapsed = s.elapsed + passedSec;
        if (newElapsed >= IDLING_SEC) {
          // アイドリングが閉じている間に終わった
          workTotal += (IDLING_SEC - s.elapsed);
          phase   = 'choice';
          elapsed = IDLING_SEC;
        } else {
          elapsed    = newElapsed;
          workTotal += passedSec;
        }
      } else if (s.phase === 'working' && !s.isPaused) {
        elapsed    = s.elapsed + passedSec;
        workTotal += passedSec;
      } else if (s.phase === 'break' && !s.isPaused) {
        elapsed = s.elapsed + passedSec;
      } else {
        elapsed = s.elapsed;
      }

      saveHistory(); // 復元した workTotal を今日の履歴にも反映
    }

    // ── Shindoi ─────────────────────────────────────────────────
    function saveShindoi() {
      const data = JSON.parse(localStorage.getItem(SHINDOI_KEY) || '{}');
      data[todayStr()] = { taps: shindoiCount, explosions: explosionCount };
      localStorage.setItem(SHINDOI_KEY, JSON.stringify(data));
    }

    function loadShindoi() {
      const data = JSON.parse(localStorage.getItem(SHINDOI_KEY) || '{}');
      const today = data[todayStr()];
      if (today) {
        shindoiCount   = today.taps || 0;
        explosionCount = today.explosions || 0;
      }
    }

    function lerpColor(c1, c2, t) {
      const [r1,g1,b1] = [parseInt(c1.slice(1,3),16), parseInt(c1.slice(3,5),16), parseInt(c1.slice(5,7),16)];
      const [r2,g2,b2] = [parseInt(c2.slice(1,3),16), parseInt(c2.slice(3,5),16), parseInt(c2.slice(5,7),16)];
      return `rgb(${Math.round(r1+(r2-r1)*t)},${Math.round(g1+(g2-g1)*t)},${Math.round(b1+(b2-b1)*t)})`;
    }

    function getGaugeColor(count) {
      const r = Math.min(count / SHINDOI_MAX, 1);
      if (r <= 0.25) return lerpColor('#4EA8DE', '#4CD964', r / 0.25);
      if (r <= 0.50) return lerpColor('#4CD964', '#FFCC00', (r - 0.25) / 0.25);
      if (r <= 0.75) return lerpColor('#FFCC00', '#FF7A00', (r - 0.50) / 0.25);
      return lerpColor('#FF7A00', '#FF3B30', (r - 0.75) / 0.25);
    }

    function updateShindoiUI() {
      const display = Math.min(shindoiCount, SHINDOI_MAX);
      const pct = (display / SHINDOI_MAX) * 100;
      shindoiGaugeFill.style.width    = pct + '%';
      shindoiGaugeFill.style.background = getGaugeColor(shindoiCount);
      shindoiCountText.textContent    = shindoiCount > 0 ? `${display} / ${SHINDOI_MAX}` : '';

      const isShaking = shindoiCount > SHINDOI_SHAKE && shindoiCount < SHINDOI_EXPLODE;
      shindoiGaugeWrap.classList.toggle('shaking', isShaking);
      shindoiGaugeWrap.classList.remove('exploding');

      if (explosionCount > 0) {
        shindoiExplosionBadge.style.display = 'inline';
        shindoiExplosionCountEl.textContent  = explosionCount;
      }
    }

    function triggerConfetti() {
      const colors = ['#FF3B30','#FF7A00','#FFCC00','#4CD964','#4EA8DE','#AF52DE','#FF2D55','#FF6B9D'];
      for (let i = 0; i < 100; i++) {
        const el = document.createElement('div');
        el.className = 'confetti-piece';
        const size = (6 + Math.random() * 9).toFixed(1);
        el.style.cssText = [
          `left:${(Math.random() * 100).toFixed(1)}vw`,
          `animation-delay:${(Math.random() * 0.8).toFixed(2)}s`,
          `animation-duration:${(2.5 + Math.random() * 2).toFixed(2)}s`,
          `background:${colors[Math.floor(Math.random() * colors.length)]}`,
          `width:${size}px`,
          `height:${size}px`,
          `transform:rotate(${Math.floor(Math.random() * 360)}deg)`,
          `border-radius:${Math.random() > 0.5 ? '50%' : '3px'}`,
        ].join(';');
        document.body.appendChild(el);
        el.addEventListener('animationend', () => el.remove(), { once: true });
      }
    }

    function triggerExplosion() {
      // Flash: fill to 100% red instantly
      shindoiGaugeFill.style.transition = 'none';
      shindoiGaugeFill.style.width      = '100%';
      shindoiGaugeFill.style.background = '#FF3B30';

      // Stop shake, start explode bounce
      shindoiGaugeWrap.classList.remove('shaking');
      void shindoiGaugeWrap.offsetWidth; // reflow to restart animation
      shindoiGaugeWrap.classList.add('exploding');

      triggerConfetti();

      // Restore fill animation and reset gauge
      setTimeout(() => {
        shindoiGaugeFill.style.transition = 'width 0.4s ease, background 0.3s ease';
        updateShindoiUI();
      }, 550);
    }

    function shindoiTap() {
      shindoiCount++;
      if (shindoiCount >= SHINDOI_EXPLODE) {
        explosionCount++;
        shindoiCount = 0;  // 爆発後リセット
        saveShindoi();
        triggerExplosion();
        return;
      }
      updateShindoiUI();
      saveShindoi();
    }

    // ── Sound effects ───────────────────────────────────────────
    function playCoinSound() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const ctx = new AudioCtx();
      const gain = ctx.createGain();
      gain.connect(ctx.destination);

      // Mario coin: B5 (988Hz) → E6 (1319Hz), square wave, quick decay
      [[988, 0, 0.08], [1319, 0.08, 0.28]].forEach(([freq, start, end]) => {
        const osc = ctx.createOscillator();
        osc.type = 'square';
        osc.frequency.value = freq;
        osc.connect(gain);
        osc.start(ctx.currentTime + start);
        osc.stop(ctx.currentTime + end);
      });

      gain.gain.setValueAtTime(0.18, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
    }
    function startIdling() {
      clearTick();
      phase = 'idling';
      elapsed = 0;
      isPaused = false;
      markPhaseStart();
      tickInterval = setInterval(tick, 1000);
      render();
    }

    function startWorking() {
      clearTick();
      phase = 'working';
      elapsed = 0;
      isPaused = false;
      markPhaseStart();
      tickInterval = setInterval(tick, 1000);
      render();
    }

    function startBreak() {
      clearTick();
      phase = 'break';
      elapsed = 0;
      isPaused = false;
      markPhaseStart();
      tickInterval = setInterval(tick, 1000);
      render();
    }

    function showChoice() {
      clearTick();
      phase = 'choice';
      isPaused = false;
      playCoinSound();
      render();
    }

    function reset() {
      clearTick();
      phase = 'standby';
      elapsed = 0;
      workTotal = 0;
      isPaused = false;
      phaseStartTime = null;
      pausedAccum = 0;
      pauseStartTime = null;
      saveState();
      saveHistory();
      render();
      sessionStats.style.display = 'none';
    }

    // ── Tick ───────────────────────────────────────────────────
    function tick() {
      if (isPaused) return;
      elapsed++;

      if (phase === 'idling') {
        workTotal++;
        saveHistory();
        saveState();
        if (elapsed >= IDLING_SEC) {
          showChoice();
          return;
        }
      } else if (phase === 'working') {
        workTotal++;
        saveHistory();
        saveState();
      } else if (phase === 'break') {
        saveState();
      }

      render();
    }

    // ── Button handlers ────────────────────────────────────────
    btnMain.addEventListener('click', () => {
      if (phase === 'standby') {
        startIdling();
        return;
      }
      if (phase === 'choice') {
        // Play from choice = same as 続行
        startWorking();
        return;
      }
      // Toggle pause
      isPaused = !isPaused;
      if (isPaused) {
        pauseStartTime = performance.now();
      } else {
        if (pauseStartTime !== null) {
          pausedAccum += performance.now() - pauseStartTime;
          pauseStartTime = null;
        }
        clearTick();
        tickInterval = setInterval(tick, 1000);
      }
      saveState();
      render();
    });

    btnSkip.addEventListener('click', () => {
      if (phase === 'working') {
        startBreak();
      } else if (phase === 'break') {
        startIdling();
      }
    });

    btnReset.addEventListener('click', () => {
      reset();
    });

    btnContinue.addEventListener('click', () => {
      startWorking();
    });

    btnRest.addEventListener('click', () => {
      startBreak();
    });

    // ── News ────────────────────────────────────────────────────
    const NHK_RSS = 'https://www.nhk.or.jp/rss/news/cat1.xml';
    const NEWS_INTERVAL = 300 * 1000; // 5 minutes
    let newsLoaded = false;
    let newsRefreshTimer = null;

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function relativeTime(dateStr) {
      const diff = (Date.now() - new Date(dateStr).getTime()) / 1000;
      if (diff < 60)    return 'たった今';
      if (diff < 3600)  return `${Math.floor(diff / 60)}分前`;
      if (diff < 86400) return `${Math.floor(diff / 3600)}時間前`;
      return `${Math.floor(diff / 86400)}日前`;
    }

    async function fetchNews() {
      const list = document.getElementById('newsList');
      list.innerHTML = '<div class="news-loading">読み込み中...</div>';
      clearTimeout(newsRefreshTimer);

      try {
        const res = await fetch('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(NHK_RSS));
        const data = await res.json();
        if (data.status !== 'ok' || !data.items?.length) throw new Error('fetch failed');

        list.innerHTML = data.items.slice(0, 40).map(item => `
          <a class="news-item" href="${escapeHtml(item.link)}" target="_blank" rel="noopener noreferrer">
            <div class="news-meta">
              <span class="news-source">NHK</span>
              <span class="news-time">${relativeTime(item.pubDate)}</span>
            </div>
            <div class="news-title">${escapeHtml(item.title)}</div>
          </a>`).join('');
        newsLoaded = true;

        const now = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
        document.getElementById('newsLastUpdate').textContent = `更新 ${now}`;
      } catch {
        list.innerHTML = '<div class="news-loading">取得エラー — ↺ で再試行</div>';
      }

      newsRefreshTimer = setTimeout(fetchNews, NEWS_INTERVAL);
    }

    // ── Tab switching ───────────────────────────────────────────
    function switchTab(name) {
      document.querySelectorAll('.tab-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.tab === name));
      document.querySelectorAll('.tab-panel').forEach(p =>
        p.classList.toggle('active', p.dataset.panel === name));
      if (name === 'news' && !newsLoaded) fetchNews();
    }

    document.getElementById('tabTimer').addEventListener('click', () => switchTab('timer'));
    document.getElementById('tabNews').addEventListener('click',  () => switchTab('news'));
    document.getElementById('btnNewsRefresh').addEventListener('click', fetchNews);
    btnShindoi.addEventListener('click', shindoiTap);

    // ── Animation loop (smooth circle) ─────────────────────────
    function animationLoop() {
      if (phase === 'idling' && phaseStartTime !== null) {
        const smooth = getSmoothedElapsed();
        const offset = CIRCUMFERENCE * (1 - Math.min(1, smooth / IDLING_SEC));
        progressCircle.style.strokeDashoffset = offset;
      }
      requestAnimationFrame(animationLoop);
    }
    requestAnimationFrame(animationLoop);

    // ── Init ───────────────────────────────────────────────────
    loadState();
    loadShindoi();
    updateShindoiUI();

    // タイマーが動いていたフェーズなら再開
    if (phase === 'idling' && !isPaused) {
      markPhaseStart();
      // elapsed 分は既に経過済みとして phaseStartTime を補正
      phaseStartTime -= elapsed * 1000;
      tickInterval = setInterval(tick, 1000);
    } else if (phase === 'working' && !isPaused) {
      markPhaseStart();
      phaseStartTime -= elapsed * 1000;
      tickInterval = setInterval(tick, 1000);
    } else if (phase === 'break' && !isPaused) {
      markPhaseStart();
      phaseStartTime -= elapsed * 1000;
      tickInterval = setInterval(tick, 1000);
    }

    // ページ離脱時にも状態を保存
    window.addEventListener('pagehide', saveState);
    window.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') saveState();
    });

    render();

    // ── Service Worker ─────────────────────────────────────────
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
