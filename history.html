<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>作業記録 | ADHDポモドーロ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
      background: #fff;
      color: #222;
      min-height: 100dvh;
      padding-bottom: 48px;
    }

    /* ── Header ── */
    .page-header {
      display: flex;
      align-items: center;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #f0f0f0;
      position: sticky;
      top: 0;
      background: #fff;
      z-index: 10;
    }

    .back-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #f5f5f5;
      text-decoration: none;
      color: #444;
      font-size: 20px;
      margin-right: 12px;
      line-height: 1;
    }

    .page-title {
      font-size: 17px;
      font-weight: 700;
    }

    /* ── Sections ── */
    .section {
      padding: 20px 16px 4px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      color: #aaa;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    /* ── Summary cards ── */
    .summary-row {
      display: flex;
      gap: 10px;
      margin-bottom: 4px;
    }

    .summary-card {
      flex: 1;
      background: #FFF0E0;
      border-radius: 14px;
      padding: 14px 16px;
    }

    .summary-card.explosion {
      background: #FFF0F0;
    }

    .summary-label {
      font-size: 12px;
      color: #CC6000;
      margin-bottom: 4px;
    }

    .summary-card.explosion .summary-label { color: #C03030; }

    .summary-value {
      font-size: 20px;
      font-weight: 700;
      color: #FF7A00;
    }

    .summary-card.explosion .summary-value { color: #FF3B30; }

    /* ── Scrollable bar chart ── */
    .chart-scroll-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 4px;
    }

    .chart-scroll-wrap::-webkit-scrollbar { height: 3px; }
    .chart-scroll-wrap::-webkit-scrollbar-thumb { background: #e0e0e0; border-radius: 2px; }

    .chart-svg { display: block; }

    /* ── History list ── */
    .history-item {
      display: flex;
      align-items: center;
      padding: 13px 0;
      border-bottom: 1px solid #f5f5f5;
      gap: 10px;
    }

    .history-date-col {
      width: 72px;
      flex-shrink: 0;
    }

    .history-date {
      font-size: 14px;
      font-weight: 600;
      color: #222;
    }

    .history-weekday {
      font-size: 11px;
      color: #bbb;
      margin-top: 1px;
    }

    .history-bar-wrap {
      flex: 1;
      height: 7px;
      background: #f0f0f0;
      border-radius: 4px;
      overflow: hidden;
    }

    .history-bar-fill {
      height: 100%;
      background: #FF7A00;
      border-radius: 4px;
      transition: width 0.6s ease;
    }

    .history-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .history-duration {
      font-size: 14px;
      font-weight: 700;
      color: #FF7A00;
      width: 52px;
      text-align: right;
    }

    .explosion-badge {
      font-size: 12px;
      font-weight: 700;
      color: #FF3B30;
      white-space: nowrap;
    }

    .empty-state {
      text-align: center;
      color: #ccc;
      font-size: 14px;
      line-height: 1.8;
      padding: 56px 0;
    }
  </style>
</head>
<body>

  <header class="page-header">
    <a href="index.html" class="back-btn">‹</a>
    <div class="page-title">今までの記録</div>
  </header>

  <div id="app"></div>

  <script>
    const DAYS_JA = ['日', '月', '火', '水', '木', '金', '土'];

    function formatDuration(secs) {
      if (secs < 60) return `${secs}秒`;
      const h = Math.floor(secs / 3600);
      const m = Math.floor((secs % 3600) / 60);
      if (h > 0 && m > 0) return `${h}h${m}m`;
      if (h > 0) return `${h}時間`;
      return `${m}分`;
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      const today = new Date().toLocaleDateString('sv');
      const yesterday = new Date(Date.now() - 86400000).toLocaleDateString('sv');
      if (dateStr === today)     return '今日';
      if (dateStr === yesterday) return '昨日';
      return `${d.getMonth() + 1}月${d.getDate()}日`;
    }

    function getDayName(dateStr) {
      return DAYS_JA[new Date(dateStr + 'T00:00:00').getDay()];
    }

    function buildChart(history) {
      // 全データを昇順（古い→新しい）
      const allDays = Object.keys(history).sort();
      if (allDays.length === 0) return '';

      const values  = allDays.map(d => history[d] || 0);
      const maxVal  = Math.max(...values, 300);
      const today   = new Date().toLocaleDateString('sv');

      const BAR_W = 28, GAP = 6, H = 100;
      const totalW = allDays.length * (BAR_W + GAP) + GAP;
      const svgW   = Math.max(totalW, 320);

      let rects = '', labels = '', valueLabels = '';

      allDays.forEach((day, i) => {
        const x      = GAP + i * (BAR_W + GAP);
        const val    = values[i];
        const barH   = val > 0 ? Math.max(6, (val / maxVal) * H) : 4;
        const y      = H - barH;
        const isToday = day === today;
        const color  = isToday ? '#FF7A00' : (val > 0 ? '#FFBB80' : '#f0f0f0');

        rects += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${BAR_W}" height="${barH.toFixed(1)}" rx="4" fill="${color}"/>`;

        // ラベル: 今日・月曜日・データが7件以下なら全日表示
        const d = new Date(day + 'T00:00:00');
        const showLabel = isToday || allDays.length <= 7 || d.getDay() === 1;
        if (showLabel) {
          const tc = isToday ? '#FF7A00' : '#bbb';
          const fw = isToday ? '700' : '400';
          const txt = isToday ? '今日' : `${d.getMonth()+1}/${d.getDate()}`;
          labels += `<text x="${(x + BAR_W/2).toFixed(1)}" y="${(H+16).toFixed(1)}" text-anchor="middle" font-size="9" fill="${tc}" font-weight="${fw}">${txt}</text>`;
        }

        if (val > 0 && (allDays.length <= 14 || isToday)) {
          valueLabels += `<text x="${(x + BAR_W/2).toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle" font-size="8" fill="#FF9933">${formatDuration(val)}</text>`;
        }
      });

      return `
        <div class="chart-scroll-wrap" id="chartScroll">
          <svg class="chart-svg" viewBox="0 0 ${svgW} ${H+28}" width="${svgW}" height="${H+28}" xmlns="http://www.w3.org/2000/svg">
            ${rects}${valueLabels}${labels}
          </svg>
        </div>`;
    }

    function render() {
      const history   = JSON.parse(localStorage.getItem('adhd-history')   || '{}');
      const shindoiDB = JSON.parse(localStorage.getItem('adhd-shindoi')   || '{}');

      const entries = Object.entries(history).sort((a, b) => b[0].localeCompare(a[0]));
      const app = document.getElementById('app');

      if (entries.length === 0) {
        app.innerHTML = `<div class="empty-state">まだ記録がありません<br>タイマーを使い始めると<br>ここに記録が残ります 📝</div>`;
        return;
      }

      const totalSecs       = entries.reduce((s, [, v]) => s + v, 0);
      const maxSecs         = Math.max(...entries.map(([, v]) => v));
      const totalExplosions = Object.values(shindoiDB).reduce((s, v) => s + (v.explosions || 0), 0);

      // ── Chart section ──
      const chartSection = document.createElement('div');
      chartSection.className = 'section';
      chartSection.innerHTML = `
        <div class="section-title">全期間グラフ</div>
        ${buildChart(history)}`;
      app.appendChild(chartSection);

      // ── Summary + List section ──
      const listSection = document.createElement('div');
      listSection.className = 'section';

      const explosionSummary = totalExplosions > 0 ? `
        <div class="summary-card explosion">
          <div class="summary-label">累計しんどい爆発</div>
          <div class="summary-value">💥 ${totalExplosions}回</div>
        </div>` : '';

      const summaryHTML = `
        <div class="summary-row">
          <div class="summary-card">
            <div class="summary-label">累計作業時間</div>
            <div class="summary-value">${formatDuration(totalSecs)}</div>
          </div>
          ${explosionSummary}
        </div>`;

      const listHTML = entries.map(([date, secs]) => {
        const pct        = maxSecs > 0 ? ((secs / maxSecs) * 100).toFixed(1) : 0;
        const shindoi    = shindoiDB[date] || {};
        const explosions = shindoi.explosions || 0;
        const badge      = explosions > 0 ? `<span class="explosion-badge">💥${explosions}</span>` : '';
        return `
          <div class="history-item">
            <div class="history-date-col">
              <div class="history-date">${formatDate(date)}</div>
              <div class="history-weekday">${getDayName(date)}曜日</div>
            </div>
            <div class="history-bar-wrap">
              <div class="history-bar-fill" style="width:${pct}%"></div>
            </div>
            <div class="history-right">
              <div class="history-duration">${formatDuration(secs)}</div>
              ${badge}
            </div>
          </div>`;
      }).join('');

      listSection.innerHTML = `<div class="section-title">全記録</div>${summaryHTML}${listHTML}`;
      app.appendChild(listSection);

      // グラフを最新日（右端）にスクロール
      const chartScroll = document.getElementById('chartScroll');
      if (chartScroll) chartScroll.scrollLeft = chartScroll.scrollWidth;
    }

    render();
  </script>
</body>
</html>
