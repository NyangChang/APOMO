<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>作業記録 | ADHDポモドーロ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
      background: #fff;
      color: #222;
      min-height: 100dvh;
      padding-bottom: 48px;
    }

    /* ── Header ── */
    .page-header {
      display: flex;
      align-items: center;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #f0f0f0;
      position: sticky;
      top: 0;
      background: #fff;
      z-index: 10;
    }

    .back-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #f5f5f5;
      text-decoration: none;
      color: #444;
      font-size: 20px;
      margin-right: 12px;
      line-height: 1;
    }

    .page-title {
      font-size: 17px;
      font-weight: 700;
    }

    /* ── Sections ── */
    .section {
      padding: 20px 16px 4px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      color: #aaa;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    /* ── Summary card ── */
    .summary-card {
      background: #FFF0E0;
      border-radius: 14px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .summary-label {
      font-size: 13px;
      color: #CC6000;
    }

    .summary-value {
      font-size: 22px;
      font-weight: 700;
      color: #FF7A00;
    }

    /* ── Bar chart ── */
    .chart-wrap {
      width: 100%;
      overflow: hidden;
    }

    .chart-svg { width: 100%; overflow: visible; }

    /* ── History list ── */
    .history-item {
      display: flex;
      align-items: center;
      padding: 13px 0;
      border-bottom: 1px solid #f5f5f5;
      gap: 10px;
    }

    .history-date-col {
      width: 72px;
      flex-shrink: 0;
    }

    .history-date {
      font-size: 14px;
      font-weight: 600;
      color: #222;
    }

    .history-weekday {
      font-size: 11px;
      color: #bbb;
      margin-top: 1px;
    }

    .history-bar-wrap {
      flex: 1;
      height: 7px;
      background: #f0f0f0;
      border-radius: 4px;
      overflow: hidden;
    }

    .history-bar-fill {
      height: 100%;
      background: #FF7A00;
      border-radius: 4px;
      transition: width 0.6s ease;
    }

    .history-duration {
      font-size: 14px;
      font-weight: 700;
      color: #FF7A00;
      width: 52px;
      text-align: right;
      flex-shrink: 0;
    }

    .empty-state {
      text-align: center;
      color: #ccc;
      font-size: 14px;
      line-height: 1.8;
      padding: 56px 0;
    }
  </style>
</head>
<body>

  <header class="page-header">
    <a href="/" class="back-btn">‹</a>
    <div class="page-title">今までの記録</div>
  </header>

  <div id="app"></div>

  <script>
    const DAYS_JA = ['日', '月', '火', '水', '木', '金', '土'];

    function formatDuration(secs) {
      if (secs < 60) return `${secs}秒`;
      const h = Math.floor(secs / 3600);
      const m = Math.floor((secs % 3600) / 60);
      if (h > 0 && m > 0) return `${h}h${m}m`;
      if (h > 0) return `${h}時間`;
      return `${m}分`;
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      const today = new Date().toLocaleDateString('sv');
      const yesterday = new Date(Date.now() - 86400000).toLocaleDateString('sv');
      if (dateStr === today)     return '今日';
      if (dateStr === yesterday) return '昨日';
      return `${d.getMonth() + 1}月${d.getDate()}日`;
    }

    function getDayName(dateStr) {
      return DAYS_JA[new Date(dateStr + 'T00:00:00').getDay()];
    }

    function getLast7Days() {
      return Array.from({ length: 7 }, (_, i) => {
        const d = new Date();
        d.setDate(d.getDate() - (6 - i));
        return d.toLocaleDateString('sv');
      });
    }

    function buildChart(history) {
      const days = getLast7Days();
      const values = days.map(d => history[d] || 0);
      const maxVal = Math.max(...values, 300); // at least 5 min for scale
      const today = new Date().toLocaleDateString('sv');

      const W = 320, H = 110, BAR_W = 30;
      const GAP = (W - 7 * BAR_W) / 8;

      let rects = '', labels = '', valueLabels = '';

      days.forEach((day, i) => {
        const x = GAP + i * (BAR_W + GAP);
        const val = values[i];
        const barH = val > 0 ? Math.max(6, (val / maxVal) * H) : 6;
        const y = H - barH;
        const isToday = day === today;
        const color = isToday ? '#FF7A00' : (val > 0 ? '#FFBB80' : '#f0f0f0');

        rects += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${BAR_W}" height="${barH.toFixed(1)}" rx="5" fill="${color}"/>`;

        const textColor = isToday ? '#FF7A00' : '#bbb';
        const fontWeight = isToday ? '700' : '400';
        labels += `<text x="${(x + BAR_W / 2).toFixed(1)}" y="${(H + 18).toFixed(1)}" text-anchor="middle" font-size="11" fill="${textColor}" font-weight="${fontWeight}">${getDayName(day)}</text>`;

        if (val > 0) {
          valueLabels += `<text x="${(x + BAR_W / 2).toFixed(1)}" y="${(y - 5).toFixed(1)}" text-anchor="middle" font-size="9" fill="#FF9933">${formatDuration(val)}</text>`;
        }
      });

      return `
        <div class="chart-wrap">
          <svg class="chart-svg" viewBox="0 0 ${W} ${H + 30}" xmlns="http://www.w3.org/2000/svg">
            ${rects}${valueLabels}${labels}
          </svg>
        </div>`;
    }

    function render() {
      const raw = localStorage.getItem('adhd-history');
      const history = raw ? JSON.parse(raw) : {};
      const entries = Object.entries(history).sort((a, b) => b[0].localeCompare(a[0]));
      const app = document.getElementById('app');

      if (entries.length === 0) {
        app.innerHTML = `<div class="empty-state">まだ記録がありません<br>タイマーを使い始めると<br>ここに記録が残ります 📝</div>`;
        return;
      }

      const totalSecs = entries.reduce((s, [, v]) => s + v, 0);
      const maxSecs = Math.max(...entries.map(([, v]) => v));

      // Chart section
      const chartSection = document.createElement('div');
      chartSection.className = 'section';
      chartSection.innerHTML = `
        <div class="section-title">直近7日間</div>
        ${buildChart(history)}`;
      app.appendChild(chartSection);

      // List section
      const listSection = document.createElement('div');
      listSection.className = 'section';

      const summaryHTML = `
        <div class="summary-card">
          <span class="summary-label">累計作業時間</span>
          <span class="summary-value">${formatDuration(totalSecs)}</span>
        </div>`;

      const listHTML = entries.map(([date, secs]) => {
        const pct = maxSecs > 0 ? ((secs / maxSecs) * 100).toFixed(1) : 0;
        return `
          <div class="history-item">
            <div class="history-date-col">
              <div class="history-date">${formatDate(date)}</div>
              <div class="history-weekday">${getDayName(date)}曜日</div>
            </div>
            <div class="history-bar-wrap">
              <div class="history-bar-fill" style="width:${pct}%"></div>
            </div>
            <div class="history-duration">${formatDuration(secs)}</div>
          </div>`;
      }).join('');

      listSection.innerHTML = `<div class="section-title">全記録</div>${summaryHTML}${listHTML}`;
      app.appendChild(listSection);
    }

    render();
  </script>
</body>
</html>
